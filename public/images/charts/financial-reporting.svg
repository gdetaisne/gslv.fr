<svg width="500" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="250" fill="#f0fdf4"/>
  
  <!-- Title -->
  <text x="250" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#064e3b">
    Reporting financier en temps réel
  </text>
  
  <!-- Pie chart representation -->
  <circle cx="150" cy="120" r="60" fill="#e2e8f0" stroke="#ffffff" stroke-width="2"/>
  <path d="M 150 60 A 60 60 0 1 1 150 180 L 150 120 Z" fill="url(#grad2)"/>
  
  <!-- Labels -->
  <text x="250" y="100" font-family="Arial, sans-serif" font-size="14" fill="#374151">68% des PME n'ont pas de</text>
  <text x="250" y="120" font-family="Arial, sans-serif" font-size="14" fill="#374151">reporting en temps réel</text>
  
  <text x="250" y="150" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">32% ont un reporting</text>
  <text x="250" y="165" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">en temps réel</text>
  
  <!-- Source -->
  <text x="20" y="230" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af">Source : PwC Global SME Survey</text>
</svg>
