<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Reporting financier en temps réel</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      margin: 0; 
      padding: 20px; 
      background: white;
    }
    .chart-container {
      width: 600px;
      height: 300px;
      position: relative;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .chart-title {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
      color: #1f2937;
    }
    .bar {
      height: 40px;
      margin: 10px 0;
      border-radius: 5px;
      display: flex;
      align-items: center;
      padding: 0 15px;
      color: white;
      font-weight: bold;
    }
    .bar-label {
      flex: 1;
    }
    .bar-value {
      font-size: 16px;
    }
    .source {
      position: absolute;
      bottom: 10px;
      right: 20px;
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <div class="chart-title">Reporting financier en temps réel</div>
    
      <div class="bar" style="background: linear-gradient(90deg, #059669 0%, #059669dd 100%); width: 100%;">
        <div class="bar-label">Pas de reporting temps réel</div>
        <div class="bar-value">68%</div>
      </div>
    
      <div class="bar" style="background: linear-gradient(90deg, #e5e7eb 0%, #e5e7ebdd 100%); width: 47%;">
        <div class="bar-label">Reporting temps réel</div>
        <div class="bar-value">32%</div>
      </div>
    
    <div class="source">Source: PwC Global SME Survey</div>
  </div>
</body>
</html>
