<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="50" fill="white" opacity="0.1"/>
  <circle cx="1100" cy="530" r="80" fill="white" opacity="0.1"/>
  <circle cx="1000" cy="150" r="30" fill="white" opacity="0.15"/>
  <circle cx="200" cy="500" r="40" fill="white" opacity="0.1"/>
  
  <!-- Main content -->
  <text x="600" y="200" text-anchor="middle" fill="url(#textGradient)" font-family="Arial, sans-serif" font-size="48" font-weight="bold">
    GSLV.fr
  </text>
  
  <text x="600" y="280" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="32" font-weight="600">
    CFO &amp; COO Part-time
  </text>
  
  <text x="600" y="330" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="500">
    Consultant Opérations Coup de Poing
  </text>
  
  <text x="600" y="400" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="400" opacity="0.9">
    Expert en structuration, levées de fonds et scaling
  </text>
  
  <text x="600" y="430" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="400" opacity="0.9">
    pour startups et scaleups
  </text>
  
  <!-- Icons -->
  <g transform="translate(300, 500)">
    <rect x="0" y="0" width="60" height="60" rx="12" fill="white" opacity="0.2"/>
    <text x="30" y="40" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24">💰</text>
  </g>
  
  <g transform="translate(570, 500)">
    <rect x="0" y="0" width="60" height="60" rx="12" fill="white" opacity="0.2"/>
    <text x="30" y="40" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24">⚙️</text>
  </g>
  
  <g transform="translate(840, 500)">
    <rect x="0" y="0" width="60" height="60" rx="12" fill="white" opacity="0.2"/>
    <text x="30" y="40" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24">🚨</text>
  </g>
  
  <!-- Bottom text -->
  <text x="600" y="580" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="400" opacity="0.8">
    gslv.fr
  </text>
</svg>
